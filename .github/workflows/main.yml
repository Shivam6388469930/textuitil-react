name: Hello world

on: 
  push:
    branches: ["gh-pages"]     # CI runs on gh-pages branch
  pull_request:
    branches: ["gh-pages"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
